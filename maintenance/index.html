<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMOG — Even geduld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <style>
    /* Colors from @smog/styles / apps/web/src/index.css */
    :root {
      --primary: #00805f;
      --secondary: #97c699;
      --background: #ebf4eb;
      --card: #f8f8f8;
      --text: #333333;
      --text-light: #666666;
      --border: #dddddd;
      --radius: 0.75rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #00a077;
        --secondary: #5a8e5c;
        --background: #121212;
        --card: #1e1e1e;
        --text: #ffffff;
        --text-light: #cccccc;
        --border: #444444;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    .logo {
      margin: 0 auto 2rem;
    }

    .logo img {
      width: 200px;
      height: auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.375rem 0.875rem;
      border-radius: 9999px;
      margin-bottom: 1.75rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.35;
      }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1rem;
      color: var(--text-light);
      line-height: 1.65;
    }

    /* Hand illustration — same SVG path used in Hero.tsx */
    .hands {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      color: var(--secondary);
    }

    .hands svg {
      width: 48px;
      height: auto;
      opacity: 0.7;
    }
    </style>
  </head>
