name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run release:check

  publish:
    needs: release-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
            build_args: |
              VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}
              VITE_WORKOS_CLIENT_ID=${{ vars.VITE_WORKOS_CLIENT_ID }}
              VITE_WORKOS_REDIRECT_URI=${{ vars.VITE_WORKOS_REDIRECT_URI }}
              VITE_CONVEX_URL=${{ vars.VITE_CONVEX_URL }}
              VITE_OPENPANEL_API_URL=${{ vars.VITE_OPENPANEL_API_URL || 'https://analytics.zias.be/api' }}
              VITE_OPENPANEL_CLIENT_ID=${{ vars.VITE_OPENPANEL_CLIENT_ID }}
          - app: remotion
            dockerfile: apps/remotion/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: vanneszias/smog-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
