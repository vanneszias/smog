name: CI

on:
  push:
    # Deploy calls this same gate on these branches; do not run it twice.
    branches-ignore: [develop, master]
  pull_request:
  # deploy.yml calls this workflow and deploys only when it passes.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  release-check:
    name: Release check (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [core, tests, mobile, render]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest (Workers pool) and workerd run on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Runs expo-doctor online: never set SMOG_OFFLINE here.
      - run: bun run release:check:${{ matrix.check }}

  e2e:
    name: Playwright e2e
    # Placeholder: Playwright e2e is added in phase 9 (off until then).
    if: ${{ vars.E2E_ENABLED == 'true' }}
    needs: release-check
    runs-on: ubuntu-latest
    steps:
      - run: echo "Playwright e2e is added in phase 9"
