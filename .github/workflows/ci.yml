name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run release:check

  site-bundle-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        id: secrets-check
        run: |
          if [ -n "${CF_API_TOKEN}" ] && [ -n "${CF_ACCOUNT_ID}" ] && [ -n "${SITE_PAYLOAD_SECRET}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping the apps/site bundle-size budget check: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and/or PAYLOAD_SECRET are not configured as repository secrets."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      - uses: actions/checkout@v5
        if: steps.secrets-check.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.secrets-check.outputs.present == 'true'
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        if: steps.secrets-check.outputs.present == 'true'
      - name: Build apps/site for staging
        if: steps.secrets-check.outputs.present == 'true'
        working-directory: apps/site
        env:
          CLOUDFLARE_ENV: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: bun run build:app
      # Measures the real upload size via `wrangler deploy --dry-run` and
      # parses its `Total Upload: X KiB / gzip: Y KiB` line — NOT a gzip of
      # `.open-next/worker.js`, which is a ~2 KB entry stub that understates
      # the true bundle size by three orders of magnitude. See
      # apps/site/scripts/check-bundle-size-ci.ts for the parser and
      # apps/site/scripts/check-bundle-size.ts for the 10 MiB limit / 8 MiB
      # warning check itself.
      - name: Enforce the 10 MiB gzipped bundle-size budget (8 MiB warning)
        if: steps.secrets-check.outputs.present == 'true'
        working-directory: apps/site
        env:
          CLOUDFLARE_ENV: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run check-bundle-size

  site-payload-types-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        id: secrets-check
        run: |
          if [ -n "${SITE_PAYLOAD_SECRET}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping the apps/site Payload types drift guard: PAYLOAD_SECRET is not configured as a repository secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SITE_PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      - uses: actions/checkout@v5
        if: steps.secrets-check.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.secrets-check.outputs.present == 'true'
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        if: steps.secrets-check.outputs.present == 'true'
      # Regenerates apps/site/src/payload-types.ts from the live collection
      # config and fails if that changes anything: a non-empty diff means a
      # collection was edited without regenerating the committed types.
      - name: Guard committed Payload types against drift
        if: steps.secrets-check.outputs.present == 'true'
        env:
          CLOUDFLARE_ENV: staging
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          bun -F site generate:types:payload
          git diff --exit-code apps/site/src/payload-types.ts

  publish:
    needs: release-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
            build_args: |
              VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}
              VITE_WORKOS_CLIENT_ID=${{ vars.VITE_WORKOS_CLIENT_ID }}
              VITE_WORKOS_REDIRECT_URI=${{ vars.VITE_WORKOS_REDIRECT_URI }}
              VITE_CONVEX_URL=${{ vars.VITE_CONVEX_URL }}
              VITE_OPENPANEL_API_URL=${{ vars.VITE_OPENPANEL_API_URL || 'https://analytics.zias.be/api' }}
              VITE_OPENPANEL_CLIENT_ID=${{ vars.VITE_OPENPANEL_CLIENT_ID }}
          - app: remotion
            dockerfile: apps/remotion/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/smog-${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
