name: Deploy

on:
  push:
    branches:
      - develop
      - master

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # The release gate (ci.yml via workflow_call). A red commit never deploys.
  release-check:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy site
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # develop → staging, master → production.
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_ENV: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set for the $CLOUDFLARE_ENV environment; skipping the deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.secrets.outputs.enabled == 'true'
        run: bun install --frozen-lockfile
      # The deploy config check (phase 8 ruling 1), first, so nothing is
      # created, migrated or built while a secret or var is missing: the
      # env's secrets (`wrangler secret list`) against requiredWorkerConfig
      # and the provider pairs, and its vars, SITE_URL and KV/D1 ids in
      # wrangler.jsonc. Production always enforces. Staging only warns
      # until the owner sets the staging environment variable
      # SMOG_REQUIRE_SECRETS=1: --warn-only turns every problem (wrangler
      # errors, output that is not JSON, a missing Worker) into a
      # ::warning::, and the `||` keeps even a crash of the script green.
      - name: Check deploy config
        if: steps.secrets.outputs.enabled == 'true'
        env:
          SMOG_REQUIRE_SECRETS: ${{ vars.SMOG_REQUIRE_SECRETS }}
        run: |
          if [ "$CLOUDFLARE_ENV" = "staging" ] && [ "$SMOG_REQUIRE_SECRETS" != "1" ]; then
            bun scripts/check-deploy-config.ts --env staging --warn-only || echo "::warning::[deploy-config] the check itself failed (exit $?); staging deploys anyway until SMOG_REQUIRE_SECRETS=1"
          else
            bun scripts/check-deploy-config.ts --env "$CLOUDFLARE_ENV"
          fi
      # The queues, their DLQs and the R2 bucket (with its CORS) that
      # wrangler.jsonc binds must exist before the deploy (phase 6). The
      # script never changes or deletes what exists. Staging creates what is
      # missing; production only checks, and fails with the exact commands,
      # unless the repository variable SMOG_PROVISION_PRODUCTION is 1.
      # SMOG_RENDER_PIPELINE is the render gate (phase 7): a GitHub
      # environment variable, absent until the owner confirms Workflows and
      # Containers access for that env. Only with it (and RENDER_MODE
      # container) does the script probe Workflows, Docker and Containers,
      # and the build add the Workflow and the Container.
      # It also writes render_pipeline=true|false to GITHUB_OUTPUT: whether
      # this deploy builds the render image (the image cache steps below).
      - name: Ensure Cloudflare resources
        id: resources
        if: steps.secrets.outputs.enabled == 'true'
        env:
          SMOG_PROVISION_PRODUCTION: ${{ vars.SMOG_PROVISION_PRODUCTION }}
          SMOG_RENDER_PIPELINE: ${{ vars.SMOG_RENDER_PIPELINE }}
        run: |
          if [ "$CLOUDFLARE_ENV" = "production" ] && [ "$SMOG_PROVISION_PRODUCTION" != "1" ]; then
            bun scripts/ensure-cloudflare-resources.ts --env "$CLOUDFLARE_ENV" --check
          else
            bun scripts/ensure-cloudflare-resources.ts --env "$CLOUDFLARE_ENV" --create
          fi
      # Migrations live in packages/db/migrations (wrangler.jsonc
      # `migrations_dir`, phase 2). Until the first one exists there is
      # nothing to apply; release-config-check keeps this path in sync.
      - name: Apply D1 migrations
        if: steps.secrets.outputs.enabled == 'true' && hashFiles('packages/db/migrations/*.sql') != ''
        working-directory: apps/site
        run: bunx wrangler d1 migrations apply DB --env "$CLOUDFLARE_ENV" --remote
      # The render image cache (phase 7 fix wave, infra M-1), only when this
      # deploy builds the SmogRenderer image. wrangler deploy runs its own
      # `docker build` of the Dockerfile on this fresh runner; without a
      # cache that rebuilds every layer on every push. So the image is
      # built first on a buildx builder with the GitHub Actions cache (this
      # job's own scope, then the render lane's), and the Deploy step's
      # `docker build` runs on that same builder (BUILDX_BUILDER), where
      # every layer is already cached. SOURCE_DATE_EPOCH=0 pins the image's
      # timestamps, so unchanged render inputs give the same image digest
      # and wrangler finds no container change to roll out.
      - name: Set up Docker Buildx (render image)
        id: buildx
        if: steps.secrets.outputs.enabled == 'true' && steps.resources.outputs.render_pipeline == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build the render image (cached)
        if: steps.secrets.outputs.enabled == 'true' && steps.resources.outputs.render_pipeline == 'true'
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          file: packages/render/container/Dockerfile
          platforms: linux/amd64
          provenance: false
          load: true
          tags: smog-renderer:deploy
          cache-from: |
            type=gha,scope=smog-renderer-deploy
            type=gha,scope=smog-renderer
          cache-to: type=gha,mode=max,scope=smog-renderer-deploy
      # The guarded site script: vite build for CLOUDFLARE_ENV, the deploy
      # guard, then wrangler deploy --env. Never a bare wrangler deploy.
      - name: Deploy
        if: steps.secrets.outputs.enabled == 'true'
        env:
          SMOG_RENDER_PIPELINE: ${{ vars.SMOG_RENDER_PIPELINE }}
          # Empty unless the render image steps ran: then wrangler's image
          # build uses their builder and cache.
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          SOURCE_DATE_EPOCH: ${{ steps.buildx.outputs.name && '0' || '' }}
        run: bun -F @smog/site deploy
