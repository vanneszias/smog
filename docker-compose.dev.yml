# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    build:
      target: development
    ports:
      - "3001:5173" # Vite dev server
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    command: sh -c "cd apps/web && bun install && bun run dev --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=development

  server:
    volumes:
      - ./apps/server:/app/apps/server
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/server/node_modules
    command: sh -c "cd apps/server && bun install && bun run dev"
    environment:
      - NODE_ENV=development

  video-worker:
    volumes:
      - ./apps/video-worker:/app/apps/video-worker
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/video-worker/node_modules
    command: sh -c "cd apps/video-worker && bun install && bun run dev"
    environment:
      - NODE_ENV=development
    # Override resource limits for development
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
