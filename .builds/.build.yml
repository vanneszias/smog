image: debian/stable
packages:
  - ca-certificates
  - curl
  - git
  - nodejs
  - unzip
secrets:
  - a6cc8145-1053-45cb-85fe-918e5e612c85
sources:
  - git@git.sr.ht:~zias/smog
environment:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
tasks:
  - setup: |
      export BUN_INSTALL="$HOME/.bun"
      export PATH="$BUN_INSTALL/bin:$PATH"
      sudo fallocate -l 4G /swapfile
      sudo chmod 600 /swapfile
      sudo mkswap /swapfile
      sudo swapon /swapfile
      curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
      {
        echo 'export BUN_INSTALL="$HOME/.bun"'
        echo 'export PATH="$BUN_INSTALL/bin:$PATH"'
      } >> ~/.buildenv
      cd smog
      bun install --frozen-lockfile --linker hoisted --network-concurrency 8 --concurrent-scripts 1 --no-progress
  - lint: |
      cd smog
      bun run check:ci
  - check-types: |
      cd smog
      bun run check-types
  - test: |
      cd smog
      bun run test
  - build: |
      cd smog
      bun run build
  - release-check: |
      cd smog
      bun run release:check
submitter:
  git.sr.ht:
    enabled: true
