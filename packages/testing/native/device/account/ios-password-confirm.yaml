appId: ${APP_ID}
---
# Resumes the account password form with current/new password already entered.
- scrollUntilVisible:
    element: "Repeat your password"
    centerElement: true
- tapOn:
    text: "Repeat your password"
    index: 1
- inputText: ${NEW_PASSWORD}
- scrollUntilVisible:
    element: "Save"
    direction: DOWN
    centerElement: true
- tapOn: "Save"
- assertVisible: "Your password has been changed. Your other devices were signed out."
- takeScreenshot: ios-password-saved
