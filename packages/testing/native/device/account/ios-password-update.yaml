appId: ${APP_ID}
---
# Account password form already expanded. Uses the text-field match after its label.
- scrollUntilVisible:
    element: "Current password"
    direction: UP
    centerElement: true
- tapOn:
    text: "Current password"
    index: 1
- inputText: ${QA_PASSWORD}
- scrollUntilVisible:
    element: "New password"
    centerElement: true
- tapOn:
    text: "New password"
    index: 1
- inputText: ${NEW_PASSWORD}
- runFlow: ios-password-confirm.yaml
