# Docker Compose — Production
#
# Uses pre-built images from the Gitea registry (built by CI).
# For local development use:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Requires: REGISTRY_IMAGE_PREFIX env var or defaults to vanneszias
# Quick start:
#   cp .env.example .env   # fill in secrets
#   docker compose pull
#   docker compose up -d

services:
  web:
    image: ${REGISTRY_IMAGE_PREFIX:-vanneszias}/smog-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost/api}
        VITE_WORKOS_CLIENT_ID: ${VITE_WORKOS_CLIENT_ID}
        VITE_WORKOS_REDIRECT_URI: ${VITE_WORKOS_REDIRECT_URI:-http://localhost/callback}
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
      remotion:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  server:
    image: ${REGISTRY_IMAGE_PREFIX:-vanneszias}/smog-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID}
      WORKOS_CLIENT_SECRET: ${WORKOS_CLIENT_SECRET}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      CONVEX_URL: ${CONVEX_URL}
      MUX_TOKEN_ID: ${MUX_TOKEN_ID}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET}
      REMOTION_URL: http://remotion:3002
      REMOTION_API_KEY: ${REMOTION_API_KEY:?REMOTION_API_KEY is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      REDIS_URL: redis://redis-session:6379/1
    depends_on:
      redis-session:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  remotion:
    image: ${REGISTRY_IMAGE_PREFIX:-vanneszias}/smog-remotion:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/remotion/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      MUX_TOKEN_ID: ${MUX_TOKEN_ID}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET}
      REMOTION_API_KEY: ${REMOTION_API_KEY:?REMOTION_API_KEY is required}
      SERVER_URL: http://server:3000
    volumes:
      - remotion-temp:/app/apps/remotion/temp
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  redis-session:
    image: redis:7-alpine
    volumes:
      - redis-session-data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis-session-data:
  remotion-temp:

networks:
  app-network:
    driver: bridge
