# Docker Compose configuration for Smog - Production Deployment
#
# This configuration uses pre-built images from Docker Hub
# Images are pulled from: vanneszias/smog-*
#
# To deploy:
#   1. Configure environment variables in .env file
#   2. Pull images: docker compose pull
#   3. Start services: docker compose up -d
#   4. View logs: docker compose logs -f
#   5. Stop services: docker compose down

services:
  # Web application with Caddy reverse proxy
  web:
    image: vanneszias/smog-web:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
      - video-worker
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # API Server
  server:
    image: vanneszias/smog-server:latest
    environment:
      - NODE_ENV=production
      - WORKOS_CLIENT_ID=${WORKOS_CLIENT_ID}
      - WORKOS_CLIENT_SECRET=${WORKOS_CLIENT_SECRET}
      - MOLLIE_API_KEY=${MOLLIE_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - CONVEX_URL=${CONVEX_URL}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET}
      - VIDEO_WORKER_URL=${VIDEO_WORKER_URL:-http://video-worker:3002}
      - VIDEO_WORKER_API_KEY=${VIDEO_WORKER_API_KEY:-dev-secret-key}
      - REDIS_HOST=redis-session
      - REDIS_PORT=6379
    depends_on:
      redis-session:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Video Worker Service with FFmpeg
  video-worker:
    image: vanneszias/smog-video-worker:latest
    environment:
      - NODE_ENV=production
      - CONVEX_URL=${CONVEX_URL}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET}
      - REDIS_HOST=redis-queue
      - REDIS_PORT=6379
      - VIDEO_COMPOSITION_CONCURRENCY=${VIDEO_COMPOSITION_CONCURRENCY:-2}
      - VIDEO_WORKER_API_KEY=${VIDEO_WORKER_API_KEY:-dev-secret-key}
      - SERVER_URL=${SERVER_URL:-http://server:3000}
    depends_on:
      redis-queue:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - video-temp:/tmp/video-processing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Redis for session storage
  redis-session:
    image: redis:7-alpine
    volumes:
      - redis-session-data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for video job queue
  redis-queue:
    image: redis:7-alpine
    volumes:
      - redis-queue-data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  redis-session-data:
    driver: local
  redis-queue-data:
    driver: local
  video-temp:
    driver: local

networks:
  app-network:
    driver: bridge
