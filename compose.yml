services:
  redis-session:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  remotion:
    image: ${REGISTRY_IMAGE_PREFIX:-vanneszias}/smog-remotion:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVER_URL: http://server:3000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.smog.vlaanderen}
    expose:
      - "3002"
    restart: unless-stopped

  server:
    image: ${REGISTRY_IMAGE_PREFIX:-vanneszias}/smog-server:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis-session:6379/1
      REMOTION_URL: http://remotion:3002
      SERVER_URL: http://server:3000
    expose:
      - "3000"
    depends_on:
      redis-session:
        condition: service_healthy
      remotion:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${REGISTRY_IMAGE_PREFIX:-vanneszias}/smog-web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
