# Docker Compose configuration for Smog - Production Deployment
#
# This configuration uses pre-built images from Docker Hub
# Images are pulled from: vanneszias/smog-*
#
# To deploy:
#   1. Configure environment variables in .env file
#   2. Pull images: docker compose pull
#   3. Start services: docker compose up -d
#   4. View logs: docker compose logs -f
#   5. Stop services: docker compose down

services:
  # Web application with Caddy reverse proxy
  web:
    image: vanneszias/smog-web:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
      - remotion
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # API Server
  server:
    image: vanneszias/smog-server:latest
    environment:
      - NODE_ENV=production
      - WORKOS_CLIENT_ID=${WORKOS_CLIENT_ID}
      - WORKOS_CLIENT_SECRET=${WORKOS_CLIENT_SECRET}
      - MOLLIE_API_KEY=${MOLLIE_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - CONVEX_URL=${CONVEX_URL}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET}
      - REMOTION_URL=${REMOTION_URL:-http://remotion:3002}
      - REMOTION_API_KEY=${REMOTION_API_KEY:-dev-secret-key}
      - REDIS_HOST=redis-session
      - REDIS_PORT=6379
    depends_on:
      redis-session:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Remotion Video Composition Service
  remotion:
    image: vanneszias/smog-remotion:latest
    environment:
      - NODE_ENV=production
      - MUX_TOKEN_ID=${MUX_TOKEN_ID}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET}
      - REMOTION_API_KEY=${REMOTION_API_KEY:-dev-secret-key}
      - SERVER_URL=${SERVER_URL:-http://server:3000}
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - remotion-temp:/app/apps/remotion/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  # Redis for session storage
  redis-session:
    image: redis:7-alpine
    volumes:
      - redis-session-data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  redis-session-data:
    driver: local
  remotion-temp:
    driver: local

networks:
  app-network:
    driver: bridge
